name: Build Pages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/configure-pages@v5

      - name: Set up directory
        run: |
          mkdir -p _site/v1

      - name: Move Prism's meta information
        run: |
          to_move=$(echo meta-launcher/*)
          mv $to_move _site/v1

      - name: Create and move modified metabolism information
        id: omniarchive
        continue-on-error: true
        run: |
          cd metabolism
          bun install
          bun start build net.minecraft
          cd ..

      - name: Install Omniarchive Minecraft metadata
        if: steps.omniarchive.outcome == 'success'
        run: |
          rm -r _site/v1/net.minecraft
          mv metabolism/run/output/net.minecraft _site/v1/

      - name: Fix index.json
        if: steps.omniarchive.outcome == 'success'
        run: |
          python3 fix_index.py

      - name: Report Omniarchive fallback
        if: steps.omniarchive.outcome != 'success'
        run: |
          echo "::warning::Omniarchive metadata is unavailable; publishing Prism Minecraft metadata as a fallback."

      - name: Build Atlas legacy loader metadata
        run: |
          python3 build_atlas_loaders.py

      - name: Publish metadata for raw.githubusercontent.com
        working-directory: _site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init
          git checkout -b metadata
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish Atlas metadata"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin metadata

      - name: Create artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    permissions:
      id-token: write
      contents: read
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
